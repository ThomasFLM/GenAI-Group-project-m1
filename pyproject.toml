[project]
name = "datagouv-rag"
version = "0.1.0"
description = "Assistant RAG + agent sur les fiches pratiques Service-Public.fr (data.gouv.fr), évalué sur un golden set"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "requests>=2.31",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
    "pyarrow>=15",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
api = ["anthropic>=1.0"]
ui = ["streamlit>=1.38"]

[dependency-groups]
dev = ["pytest>=8", "lxml>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
